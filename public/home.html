<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム — Tabula-Piece</title>
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

<header class="page-header">
  <div class="page-title">Tabula-Piece</div>
  <nav class="nav-links">
    <a href="quest.html">クエスト</a>
    <a href="gacha.html">ガチャ</a>
    <a href="decks.html">デッキ</a>
    <a href="characters.html">キャラ</a>
    <a href="ranking.html">ランキング</a>
    <span id="user-name" class="nav-user"></span>
    <button id="logout-btn" class="nav-logout">ログアウト</button>
  </nav>
</header>

<!-- クイックアクション -->
<div class="home-section">
  <a class="quick-play-btn" href="decks.html">
    <span class="quick-play-icon">⚔️</span>
    <span>対戦する</span>
  </a>
  <a class="quick-play-btn" href="quest.html" style="background:var(--bg-panel);color:var(--text-primary);border:1px solid rgba(245,197,24,0.4);margin-top:8px;">
    <span class="quick-play-icon">🗺️</span>
    <span>クエスト (PvE)</span>
  </a>
  <a href="rules.html" style="display:block;text-align:center;margin-top:10px;font-size:13px;color:var(--text-muted);text-decoration:none;">❓ 遊び方を見る</a>
</div>

<!-- 進行中の試合 -->
<div class="home-section">
  <div class="section-title">進行中の対戦</div>
  <div id="matches-list">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<!-- 終了した試合 -->
<div class="home-section" id="finished-section" style="display:none">
  <div class="section-title">最近の結果</div>
  <div id="finished-list"></div>
</div>

<script src="js/auth.js"></script>
<script src="js/home.js"></script>
</body>
</html>
